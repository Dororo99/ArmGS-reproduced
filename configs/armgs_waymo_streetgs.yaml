# ArmGS Waymo paper-protocol reference profile.
#
# IMPORTANT: this file records the target protocol, but it is not yet a
# runnable Waymo trainer configuration. The current first-stage adapter only
# validates Waymo-v2 parquet components and prepares RGB evaluation assets.
# Camera poses, LiDAR/Colmap fusion, actor tracks, depth maps, and sky masks
# must be wired into an ArmGS Waymo training manifest before training.
model:
  frame_embedding_dim: 16
  sh_degree: 3
  local:
    hidden_dim: 64
    num_layers: 3                 # ArmGS paper
    scale_delta_limit: 1.0        # bounded implementation assumption
    bias_limit: 0.5               # bounded implementation assumption
    hash_grid:
      num_levels: 8
      features_per_level: 2
      log2_hashmap_size: 15
      base_resolution: 16
      max_resolution: 2048
      chunk_size: 65536
  global:
    hidden_dim: 64
    num_layers: 4                 # ArmGS paper
    position_frequencies: 6
    direction_frequencies: 4
    matrix_delta_limit: 0.5       # bounded implementation assumption
    bias_limit: 0.5               # bounded implementation assumption
  actor:
    hidden_dim: 64
    encoder_layers: 2             # ArmGS paper
    head_layers: 2                # ArmGS paper
    position_frequencies: 6
    time_frequencies: 6
  sky:
    resolution: 256               # cubemap resolution assumption
    initial_color: [0.5, 0.5, 0.5]

initialization:
  initial_opacity: 0.1            # implementation assumption
  initial_scale: 0.05             # implementation assumption
  knn_neighbors: 3
  knn_chunk_size: 1024
  knn_backend: auto
  minimum_squared_distance: 0.0000001
  voxel_size: 0.1                 # implementation assumption
  actor_box_scale: 1.0
  # Paper-required sources. Declarative only until the Waymo trainer adapter
  # performs coordinate-aligned fusion and dynamic-object filtering.
  required_sources: [lidar, sfm]

data:
  waymo:
    format: v2_parquet
    parquet_dir: validation
    camera_channels: [FRONT]      # official StreetGS experiment configs use camera 0
    target_height: 1066           # ArmGS paper evaluation resolution
    target_width: 1600
    resize:
      scale_from_source_width: 0.8333333333333334  # 5/6, also applied to both K rows
      interpolation: bilinear
      image_format: png           # lossless GT targets
    official_sequences: configs/waymo_streetgs_sequences.txt
  split:
    every: 4                      # StreetGS split_test: 4
    offset: 0
    start_position: 4             # held out: relative captures 4, 8, 12, ...
  sampler:
    seed: 0
    shuffle: true
    num_workers: 0

optimization:
  iterations: 30000              # ArmGS paper
  sh_degree_interval: 1000
  learning_rates:
    mean_initial: 0.00016
    mean_final: 0.0000016
    rotation: 0.001
    scale: 0.005
    opacity: 0.05
    sh: 0.0025
    appearance: 0.001
    actor_deformation: 0.001
    actor_pose: 0.0001
    sky: 0.001
  densification:
    start_iteration: 500
    end_iteration: 15000
    interval: 100
    position_gradient_threshold: 0.0002
    split_scale_fraction_of_scene: 0.01
    prune_opacity_threshold: 0.005
    split_children: 2
    split_scale_reduction: 1.6
    opacity_reset_value: 0.01
    opacity_reset_interval: 3000
    max_screen_radius: 20
    prune_world_scale_fraction_of_scene: 0.1
    prune_large_after_iteration: 3000
    minimum_gaussians: 0

loss:
  lambda_ssim: 0.2
  ssim_window_size: 11
  ssim_sigma: 1.5
  ssim_data_range: 1.0
  require_auxiliary: true
  lambda_depth: 0.01
  lambda_sky: 0.05
  lambda_foreground: 0.1

# Metadata for final reporting. The current config loader ignores this block;
# scripts/evaluate_armgs.py implements these metrics from rendered RGB files.
evaluation:
  views: [reconstruction, novel_view]
  metrics: [psnr, ssim, lpips]
  lpips_net: alex
  resolution: [1066, 1600]
  target_format: png
  periodic_test_evaluation: false
