[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armgs-research"
version = "0.1.0"
description = "Research implementation of ArmGS appearance refinement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
integration = [
  "gsplat>=1.0",
]
data = [
  "Pillow>=9.0",
  "scipy>=1.8",
]
waymo = [
  "Pillow>=9.0",
  "pyarrow>=10.0",
  "scipy>=1.8",
]
evaluation = [
  "lpips>=0.1.4",
]
tracking = [
  "wandb>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
